name: CI Checks

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  # 允许手动触发
  workflow_dispatch:

jobs:
  # 后端构建和检查
  backend:
    name: Backend Build & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: ./backend
        run: npm ci

      - name: Generate Prisma client
        working-directory: ./backend
        run: npx prisma generate

      - name: Build backend
        working-directory: ./backend
        run: npm run build

      - name: Lint backend
        working-directory: ./backend
        run: npm run lint
        continue-on-error: true

  # 前端构建
  frontend-build:
    name: Frontend Build & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build frontend
        working-directory: ./frontend
        run: npm run build

      - name: Lint frontend
        working-directory: ./frontend
        run: npm run lint
        continue-on-error: true

  # E2E 测试（需要后端服务）
  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [backend, frontend-build]
    # 只在 main/master 分支的 push 或手动触发时运行
    # Requires explicitly configured isolated E2E database and accounts.
    if: github.event_name == 'workflow_dispatch' && vars.E2E_ENABLED == 'true'

    env:
      # 后端环境变量
      JWT_SECRET: ${{ secrets.E2E_JWT_SECRET }}
      JWT_EXPIRES_IN: 7d
      PORT: 3000
      DATABASE_URL: ${{ secrets.E2E_DATABASE_URL }}
      DATABASE_DIRECT_URL: ${{ secrets.E2E_DATABASE_DIRECT_URL }}
      AI_PROVIDER: mock

      # 测试账号环境变量
      ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
      ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
      MANAGER_EMAIL: ${{ secrets.E2E_MANAGER_EMAIL }}
      MANAGER_PASSWORD: ${{ secrets.E2E_MANAGER_PASSWORD }}
      COACH_EMAIL: ${{ secrets.E2E_COACH_EMAIL }}
      COACH_PASSWORD: ${{ secrets.E2E_COACH_PASSWORD }}
      SALES_EMAIL: ${{ secrets.E2E_SALES_EMAIL }}
      SALES_PASSWORD: ${{ secrets.E2E_SALES_PASSWORD }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install backend dependencies
        working-directory: ./backend
        run: npm ci

      - name: Generate Prisma client
        working-directory: ./backend
        run: npx prisma generate

      - name: Build backend
        working-directory: ./backend
        run: npm run build

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: ./frontend
        run: npx playwright install --with-deps chrome

      - name: Start backend server
        working-directory: ./backend
        run: npm start &
        # 后台运行后端服务

      - name: Wait for backend to be ready
        run: |
          echo "Waiting for backend to start..."
          for i in {1..30}; do
            if curl --fail --silent http://localhost:3000/health > /dev/null 2>&1; then
              echo "Backend is ready!"
              exit 0
            fi
            echo "Waiting... ($i/30)"
            sleep 2
          done
          echo "Service readiness timed out" >&2
          exit 1

      - name: Start frontend dev server
        working-directory: ./frontend
        run: npm run dev &
        # 后台运行前端服务

      - name: Wait for frontend to be ready
        run: |
          echo "Waiting for frontend to start..."
          for i in {1..30}; do
            if curl --fail --silent http://localhost:5173 > /dev/null 2>&1; then
              echo "Frontend is ready!"
              exit 0
            fi
            echo "Waiting... ($i/30)"
            sleep 2
          done
          echo "Service readiness timed out" >&2
          exit 1

      - name: Run E2E tests
        working-directory: ./frontend
        run: npx playwright test
        env:
          CI: true

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 30

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: frontend/test-results/
          retention-days: 30

  container-build:
    name: Production container builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend production image
        run: docker build --target production -t greatstart-backend:ci ./backend
      - name: Build migration image
        run: docker build --target migration -t greatstart-migration:ci ./backend
      - name: Build frontend production image
        run: docker build -t greatstart-frontend:ci ./frontend
      - name: Validate Nginx configuration
        run: docker run --rm --add-host backend:127.0.0.1 greatstart-frontend:ci nginx -t
