# ==================================================
# Buzzer 生产环境覆盖配置
# ==================================================
# 用法: docker-compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# ==================================================

services:
  migration:
    image: ${BACKEND_IMAGE:-greatstart-backend}-migration:${RELEASE_TAG:-local}
    profiles: ["migration"]
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: migration
    env_file:
      - ${BACKEND_ENV_FILE:-./backend/.env}
    environment:
      NODE_ENV: production
    networks:
      - buzzer-network

  backend:
    image: ${BACKEND_IMAGE:-greatstart-backend}:${RELEASE_TAG:-local}
    labels:
      io.greatstart.release: ${RELEASE_TAG:-local}
      org.opencontainers.image.revision: ${VCS_REF:-unknown}
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  frontend:
    image: ${FRONTEND_IMAGE:-greatstart-frontend}:${RELEASE_TAG:-local}
    labels:
      io.greatstart.release: ${RELEASE_TAG:-local}
      org.opencontainers.image.revision: ${VCS_REF:-unknown}
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
