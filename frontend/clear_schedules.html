<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>清空排课数据</title>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
</head>
<body>
    <h1>清空排课数据工具</h1>
    <button onclick="clearData()">点击清空schedules表数据</button>
    <div id="result"></div>

    <script>
        // 从环境变量读取配置（需要手动填入）
        const MEMFIRE_URL = 'https://d4r9c60g91htqli3v480.baseapi.memfiredb.com';
        const MEMFIRE_ANON_KEY = ''; // 需要填入您的anon key
        
        const memfire = supabase.createClient(MEMFIRE_URL, MEMFIRE_ANON_KEY);

        async function clearData() {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = '正在清空数据...';
            
            try {
                // 1. 清空schedules表
                const { error: scheduleError, count } = await memfire
                    .from('schedules')
                    .delete()
                    .neq('id', '00000000-0000-0000-0000-000000000000'); // 删除所有记录
                
                if (scheduleError) {
                    resultDiv.innerHTML = `清空schedules失败: ${scheduleError.message}`;
                    return;
                }
                
                // 2. 清空classes表的scheduleRule字段
                const { error: classError } = await memfire
                    .from('classes')
                    .update({ scheduleRule: null })
                    .neq('id', '00000000-0000-0000-0000-000000000000');
                
                if (classError) {
                    resultDiv.innerHTML = `清空scheduleRule失败: ${classError.message}`;
                    return;
                }
                
                resultDiv.innerHTML = `✅ 成功清空数据！删除了所有排课记录，并清空了班级的排课规则。`;
            } catch (error) {
                resultDiv.innerHTML = `❌ 错误: ${error.message}`;
            }
        }
    </script>
</body>
</html>
